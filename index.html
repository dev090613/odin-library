<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>The Odin Library</title>
  </head>
  <body>
    <header>
      <h1>myLibrary</h1>
      <button class="add-book-btn" type="button">+ Add Book</button>
    </header>
    <main>
      <div class="card-container">
      </div>
    </main>
    <!-- DIALOG -->
    <dialog id="bookDialog" aria-labelledby="bookDialogTitle">
      <form id="bookForm" class="book-form">
        <h2 id="bookDialogTitle">Add a book</h2>
        <div class="field">
          <label for="title">Title </label>
          <input type="text" id="title" name="title" required maxlength="100">
        </div>
        <div class="field">
          <label for="author">Author </label>
          <input type="text" id="author" name="author" required maxlength="100">
        </div>
        <div class="field">
          <label for="pages">Pages </label>
          <input type="number" id="pages" name="pages" min="1" max="9999" required>
        </div>
        <div class="field field--inline">
          <label for="read">I've read it</label>
          <input type="checkbox" id="read" name="read">
        </div>
        <div class="form-btns">
          <button type="button" class="cancel-btn">Cancel</button>
          <button type="submit" class="confirm-btn">Add</button>
        </div>
      </form>
    </dialog>
    <!-- TEMPLATE -->
    <template id="book-template">
      <div class="card">
        <h2 class="book-title"></h2>
        <p class="book-author"></p>
        <p class="book-pages"></p>
        <div class="card-btns">
          <button type="button" class="read-btn"></button>
          <button type="button" class="delete-btn">delete</button>
        </div>
      </div>
    </template>
  </body>
</html>
